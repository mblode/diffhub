name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Changeset Status
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm exec changeset status --since origin/main

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types

      # The schema tests guard a contract a human cannot eyeball: unique and
      # resolvable JSON-LD ids, and FAQ answers matching the rendered ones.
      # Unrun, they are documentation.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
